name: Build IPA

on:
  workflow_dispatch:  # run manually with one click

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: AriaAI
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: AriaAI
        run: |
          xcodebuild archive \
            -project AriaAI.xcodeproj \
            -scheme AriaAI \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AriaAI.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: Find app bundle
        run: |
          echo "Archive contents:"
          find "$RUNNER_TEMP/AriaAI.xcarchive" -name "*.app" -maxdepth 6
          APP_PATH=$(find "$RUNNER_TEMP/AriaAI.xcarchive" -name "*.app" -maxdepth 6 | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r AriaAI.ipa Payload
          echo "IPA size: $(du -sh AriaAI.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AriaAI-ipa
          path: AriaAI.ipa
          retention-days: 7
