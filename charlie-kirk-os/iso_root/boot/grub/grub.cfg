set default=0
set timeout=5
set timeout_style=menu

# Charlie Kirk OS GRUB theme colors
set color_normal=light-red/black
set color_highlight=white/red

insmod all_video
insmod gfxterm
insmod font

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    terminal_output gfxterm
fi

menuentry "  Charlie Kirk OS v1.0 — FREEDOM EDITION" {
    linux   /boot/vmlinuz root=/dev/sda rw quiet loglevel=3 console=ttyS0 console=tty0
    initrd  /boot/initrd.img
}

menuentry "  Charlie Kirk OS (verbose boot — no censorship)" {
    linux   /boot/vmlinuz root=/dev/sda rw console=ttyS0 console=tty0
    initrd  /boot/initrd.img
}

menuentry "  Reboot (No Retreat, No Surrender)" {
    reboot
}

menuentry "  Power Off (Mission Accomplished)" {
    halt
}
